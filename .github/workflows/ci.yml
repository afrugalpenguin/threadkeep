name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm pack:check
      - run: pnpm test

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: gitleaks on full history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
      - name: write denylist from secret
        env:
          DENYLIST: ${{ secrets.THREADKEEP_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then echo "THREADKEEP_DENYLIST secret is not set"; exit 1; fi
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
      - name: hygiene scan on full history
        env:
          THREADKEEP_DENYLIST: ${{ runner.temp }}/denylist.txt
        run: node scripts/check-hygiene.mjs --history
